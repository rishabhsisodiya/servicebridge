# Local infrastructure for development. Ports are shifted (5433, 6380) so they
# don't collide with a Postgres or Redis already installed on the machine.
name: servicebridge

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: servicebridge
      POSTGRES_PASSWORD: servicebridge
      POSTGRES_DB: servicebridge
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicebridge -d servicebridge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    # Append-only persistence: delayed BullMQ timers (SLA, AMC...) survive restarts.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
